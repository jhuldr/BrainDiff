[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braindiff"
version = "1.0.0"
description = "Longitudinal comparison-report generation for multimodal brain MRI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.1",
    "numpy",
    "pandas",
    "pyyaml",
    "peft",
    "transformers",
    "huggingface_hub",
    "monai",
    "nibabel",
    "SimpleITK",
    "syntok",
    "matplotlib",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
# RadGraph pins transformers<5 and cannot share the trainer's interpreter.
scoring = ["radgraph", "nltk"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"braindiff.eval" = ["vocab/*.txt", "vocab/*.csv"]
"braindiff" = ["configs/*.yaml"]
